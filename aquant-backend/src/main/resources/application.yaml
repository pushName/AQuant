# 智能分析服务配置。Python 服务独立运行，Java 只通过 HTTP/SSE 交互。
analysis:
  executor:
    threads: ${ANALYSIS_EXECUTOR_THREADS:2}
  python:
    enabled: ${ANALYSIS_PYTHON_ENABLED:true}
    base-url: ${ANALYSIS_PYTHON_BASE_URL:http://127.0.0.1:8000}
    poll-millis: ${ANALYSIS_PYTHON_POLL_MILLIS:1000}

