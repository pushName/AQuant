server:
  port: 8084

spring:
  application:
    name: aquant-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/stock?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&socketTimeout=60000&connectTimeout=30000&keepAlive=true
    username: root
    password: root
#    url: jdbc:mysql://10.0.0.13:3306/stock?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&socketTimeout=60000&connectTimeout=30000
#    url: jdbc:mysql://122.51.163.243:3306/stock?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&socketTimeout=60000&connectTimeout=30000
#    username: stock
#    password: 2272tDrNXeBjaHKy
    type: com.alibaba.druid.pool.DruidDataSource
    # Druid 连接池配置
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 30000   # 缩短检查间隔到 30 秒
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: true      # 关键：获取连接时验证有效性
      test-on-return: false
      pool-prepared-statements: true
      filters: stat,wall,slf4j
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  mail:
    host: smtp.qq.com # 请替换为您真实的 SMTP 服务器 (如 smtp.163.com)
    username: 2631650610@qq.com # 请替换为您发件邮箱账号
    password: oezygyaylcwleadi # 请替换为发件邮箱对应的 SMTP 授权码（不是登录密码）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true


# Druid 监控页面配置
